name: Release candidate

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci-gate:
    name: Require CI for the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for the exact commit's CI run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 360); do
            runs=$(gh run list --repo "$GH_REPO" --workflow ci.yml --commit "$EXPECTED_SHA" \
              --event push --limit 10 --json status,conclusion,headSha,createdAt)
            run=$(jq -c --arg sha "$EXPECTED_SHA" '[.[] | select(.headSha == $sha)] | sort_by(.createdAt) | last // empty' <<< "$runs")
            if [ -n "$run" ]; then
              status=$(jq -r '.status' <<< "$run")
              conclusion=$(jq -r '.conclusion // ""' <<< "$run")
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  echo "CI passed for $EXPECTED_SHA"
                  exit 0
                fi
                echo "CI for $EXPECTED_SHA completed with conclusion: $conclusion" >&2
                exit 1
              fi
            fi
            sleep 10
          done
          echo "Timed out waiting for successful CI on $EXPECTED_SHA" >&2
          exit 1

  build-and-release:
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - name: Verify tag and package versions
        run: python -c "import pathlib,tomllib; expected='v'+tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']; assert expected == '${{ github.ref_name }}', (expected, '${{ github.ref_name }}')"
      - run: python -m build
      - run: cp install.ps1 uninstall.ps1 dist/
      - run: sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/attest@v4
        with:
          subject-path: "dist/*"
      - name: Create release and attach distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --verify-tag --generate-notes

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: git config --global user.name "Graphtyn CI"; git config --global user.email "ci@graphtyn.invalid"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,treesitter]'
      - run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/graphtyn-release-venv
      - run: /tmp/graphtyn-release-venv/bin/pip install dist/*.whl
      - run: /tmp/graphtyn-release-venv/bin/graphtyn --version
      - run: /tmp/graphtyn-release-venv/bin/python -c "import importlib.resources as r; assert r.files('graphtyn').joinpath('web/dashboard.html').is_file()"
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/

  windows:
    name: Windows portability
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: git config --global user.name "Graphtyn CI"; git config --global user.email "ci@graphtyn.invalid"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_deployment_admin.py tests/test_api.py tests/test_shared_memory.py tests/test_history_import.py
      - run: python -m pip install build; python -m build
      - name: Install the wheel through the public PowerShell installer
        shell: pwsh
        run: |
          $wheel = (Resolve-Path "dist/*.whl").Path
          ./install.ps1 -PackageSource $wheel -ProjectPath . -SkipService -SkipSetup -NoOpen
          $binDir = (py -3 -m pipx environment --value PIPX_BIN_DIR | Select-Object -Last 1).Trim()
          & (Join-Path $binDir "graphtyn.exe") --version
      - name: Start and query the dashboard on Windows
        shell: pwsh
        run: |
          $binDir = (py -3 -m pipx environment --value PIPX_BIN_DIR | Select-Object -Last 1).Trim()
          $exe = Join-Path $binDir "graphtyn.exe"
          $process = Start-Process -FilePath $exe -ArgumentList @("serve", "--host", "127.0.0.1", "--port", "9210", "--path", (Get-Location).Path) -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try { $response = Invoke-RestMethod "http://127.0.0.1:9210/api/projects"; $ready = $true; break }
              catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw "El dashboard no respondió en Windows." }
          } finally { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
      - shell: pwsh
        run: |
          $binDir = (py -3 -m pipx environment --value PIPX_BIN_DIR | Select-Object -Last 1).Trim()
          & (Join-Path $binDir "graphtyn.exe") service install --kind windows --path . --output "$env:RUNNER_TEMP\graphtyn-dashboard.cmd"

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - run: python tests/smoke_frontend.py

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]' pip-audit
      - run: python -m pytest -q tests/test_security_leaks.py tests/test_release_contracts.py
      - run: python -m pip_audit

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag graphtyn:ci .
      - run: docker run --rm graphtyn:ci --version

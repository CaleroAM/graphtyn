[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-graph"
version = "0.1.0"
description = "Zero-Token AST Deterministic + Hybrid Semantic RAG Graph for AI Coding Agents (MCP & CLI)"
readme = "README.md"
authors = [{ name = "OpenClaw Team", email = "developer@openclaw.dev" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "mcp>=1.0.0",
    "pydantic>=2.6.0",
    "typing-extensions>=4.10.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0"
]
multimodal = [
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0"
]
media = [
    "faster-whisper>=1.0.0"
]
treesitter = [
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-c-sharp>=0.23.1,<0.24",
    "tree-sitter-javascript>=0.23.1,<0.26",
    "tree-sitter-typescript>=0.23.2,<0.24",
    "tree-sitter-python>=0.23.6,<0.24",
    "tree-sitter-java>=0.23.5,<0.24",
    "tree-sitter-go>=0.23.4,<0.24",
    "tree-sitter-rust>=0.23.2,<0.24",
    "tree-sitter-php>=0.24.1,<0.25"
]

[project.scripts]
aether-graph = "aether_graph.cli:main"

[tool.setuptools.package-data]
aether_graph = ["web/*.html", "web/*.css", "web/*.js", "web/js/*.js"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graphtyn"
version = "0.6.0"
description = "Graphtyn: deterministic code graph, impact analysis and compact context for AI coding agents"
readme = "README.md"
authors = [{ name = "Graphtyn Contributors" }]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "starlette>=1.3.1",
    "uvicorn>=0.28.0",
    "mcp>=1.0.0",
    "pydantic>=2.6.0",
    "typing-extensions>=4.10.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
keywords = ["code-graph", "mcp", "ai-agents", "semantic-memory", "impact-analysis"]

[project.optional-dependencies]
dev = [
    "build>=1.2.2",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "playwright>=1.50.0"
]
multimodal = [
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0"
]
media = [
    "faster-whisper>=1.0.0"
]
security = [
    "cryptography>=42.0.0"
]
treesitter = [
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-c-sharp>=0.23.1,<0.24",
    "tree-sitter-javascript>=0.23.1,<0.26",
    "tree-sitter-typescript>=0.23.2,<0.24",
    "tree-sitter-python>=0.23.6,<0.24",
    "tree-sitter-java>=0.23.5,<0.24",
    "tree-sitter-go>=0.23.4,<0.24",
    "tree-sitter-rust>=0.23.2,<0.24",
    "tree-sitter-php>=0.24.1,<0.25"
]

[project.scripts]
graphtyn = "graphtyn.cli:main"

[tool.setuptools.package-data]
graphtyn = ["client.ts", "web/*.html", "web/*.css", "web/*.js", "web/*.svg", "web/js/*.js"]

[tool.setuptools.packages.find]
include = ["graphtyn*"]

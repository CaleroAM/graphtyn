[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-graph"
version = "0.1.0"
description = "Zero-Token AST Deterministic + Hybrid Semantic RAG Graph for AI Coding Agents (MCP & CLI)"
readme = "README.md"
authors = [{ name = "OpenClaw Team", email = "developer@openclaw.dev" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "mcp>=1.0.0",
    "pydantic>=2.6.0",
    "typing-extensions>=4.10.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0"
]

[project.scripts]
aether-graph = "aether_graph.cli:main"
